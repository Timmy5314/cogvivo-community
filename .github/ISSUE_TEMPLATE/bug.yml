name: 🐞 Bug
description: Something in Cogvivo does not work right
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security problem?** Do not post it here. Report it privately via *Security → Report a vulnerability*.
  - type: textarea
    id: what
    attributes:
      label: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we repeat it?
      placeholder: "1. Open ...\n2. Tap ...\n3. See ..."
  - type: input
    id: device
    attributes:
      label: Phone/computer and browser
      placeholder: Android 15, Chrome
  - type: markdown
    attributes:
      value: By submitting you agree to [CONTRIBUTING.md](https://github.com/Timmy5314/cogvivo-community/blob/main/CONTRIBUTING.md).
