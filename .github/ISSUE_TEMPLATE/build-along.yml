name: 🧑‍💻 Build along
description: You want to help regularly with code, design, translation or testing
labels: [build along]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like to help with?
    validations:
      required: true
  - type: input
    id: work
    attributes:
      label: Earlier work (optional)
      placeholder: A link to your work or profile
  - type: markdown
    attributes:
      value: By submitting you agree to [CONTRIBUTING.md](https://github.com/Timmy5314/cogvivo-community/blob/main/CONTRIBUTING.md).
